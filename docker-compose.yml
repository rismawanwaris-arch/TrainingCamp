name: trainingcamp
services:
  knowledgebase:
    build: .
    container_name: trainingcamp-kb
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATA_DIR=/app/data
      - UPLOADS_DIR=/app/data/uploads
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./data:/app/data
